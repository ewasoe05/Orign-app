name: Deploy Supabase migrations

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Add GitHub Actions secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD."
            echo "Token: https://supabase.com/dashboard/account/tokens"
            echo "Password: Supabase → Project Settings → Database"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "${SUPABASE_PROJECT_ID:-gpnazcsoyxwnhuefxofw}"

      - name: Push migrations
        run: supabase db push --yes
